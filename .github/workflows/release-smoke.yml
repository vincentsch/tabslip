name: Public release smoke
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release to verify
        required: true
        default: v0.1.0
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify public downloads and native demo
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/public-release-smoke.py
      - name: Keep verification result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-release-smoke-${{ matrix.os }}
          path: |
            public-release-smoke-result.json
            public-release-trust/
          if-no-files-found: error
